<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SaturnLauncher</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          // Have to keep this list in sync with THEMES in src/stores/theme.js
          var themeClasses = ['dark', 'light'];
          var stored = localStorage.getItem('saturn.theme');
          var cls = themeClasses.indexOf(stored) !== -1 ? stored : 'dark';
          for (var i = 0; i < themeClasses.length; i++) {
            document.documentElement.classList.remove(themeClasses[i]);
          }
          document.documentElement.classList.add(cls);
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })();
    </script>
    <script src="./src/main.jsx" type="module"></script>
  </body>
</html>
