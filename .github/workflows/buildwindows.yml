name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build Windows app
        run: wails build -platform windows/amd64 -webview2 download -nsis -s

      - name: List build output
        run: Get-ChildItem -Path build -Recurse | Select-Object FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaturnLauncher-windows
          path: |
            build/bin/SaturnLauncher.exe
            build/bin/*-installer.exe